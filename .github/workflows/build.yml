name: Build Fastpanel ZIP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ZIP
        run: npm run build:zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: fastpanel-dist
          path: dist.zip
